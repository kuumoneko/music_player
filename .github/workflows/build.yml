name: Build & Release

on:
    workflow_run:
        workflows: ["Typecheck"]
        types:
            - completed
        branches:
            - main

permissions:
    contents: write

jobs:
    release:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GH_PAT }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Setup .NET 10 SDK
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Install Inno Setup
              run: choco install innosetup -y

            - name: Cache Bun
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - name: Cache NuGet
              uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
                  restore-keys: nuget-${{ runner.os }}-

            - name: Cache .NET build
              uses: actions/cache@v4
              with:
                  path: |
                      app-winui/KuumoApp/obj
                      app-winui/Launcher/obj
                  key: dotnet-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.cs') }}
                  restore-keys: dotnet-${{ runner.os }}-

            - name: Cache backend build
              uses: actions/cache@v4
              id: cache-backend
              with:
                  path: |
                      build/backend.js
                      build/backend.exe
                      build/bin
                      build/*.dll
                  key: backend-${{ runner.os }}-${{ hashFiles('src/bun/**/*.ts', 'scripts/build.ts') }}
                  restore-keys: backend-${{ runner.os }}-

            - name: Cache dotnet publish
              uses: actions/cache@v4
              id: cache-publish
              with:
                  path: build/publish
                  key: publish-${{ runner.os }}-${{ hashFiles('app-winui/**/*.cs', 'app-winui/**/*.xaml', 'app-winui/**/*.csproj', 'app-winui/**/*.resw') }}
                  restore-keys: publish-${{ runner.os }}-

            - name: Cache native DLLs
              uses: actions/cache@v4
              id: cache-bin
              with:
                  path: bin
                  key: musicapp-bin-${{ hashFiles('.github/workflows/build.yml') }}
                  restore-keys: musicapp-bin-

            - name: Clone musicapp-bin
              if: steps.cache-bin.outputs.cache-hit != 'true'
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.CLONE_REPO }}
              run: |
                  [ -d bin/.git ] || gh repo clone kuumoneko/musicapp-bin bin -- --depth 1

            - name: Check if release needed
              id: check
              shell: bash
              env:
                GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
              run: |
                VERSION=$(awk '/^## Version$/{getline; if (/^>/) {sub(/^>\s*/, ""); print} else {getline; sub(/^>\s*/, ""); print}}' README.md | tr -d '\r' | xargs)
                if [ -z "$VERSION" ]; then
                  echo "No version found in README.md"
                  echo "should_release=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
      
                TAG="v$VERSION"
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      
                # 1. Handle manual trigger (force release)
                if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                  echo "Triggered manually — forcing release for $TAG"
                  SHOULD_RELEASE=true
                else
                  # 2. Check latest GitHub release version
                  LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null | sed 's/^v//')
      
                  if [ -z "$LATEST" ]; then
                    echo "No existing release found — will release"
                    SHOULD_RELEASE=true
                  else
                    HIGHER=$(printf '%s\n%s' "$LATEST" "$VERSION" | sort -V | tail -n 1)
                    if [ "$HIGHER" = "$VERSION" ] && [ "$VERSION" != "$LATEST" ]; then
                      echo "README version ($VERSION) is newer than latest release ($LATEST)"
                      SHOULD_RELEASE=true
                    else
                      echo "README version ($VERSION) is not newer than latest release ($LATEST) — skipping"
                      SHOULD_RELEASE=false
                    fi
                  fi
                fi
      
                echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
      
                # 3. If releasing, check and delete existing release/tag
                if [ "$SHOULD_RELEASE" = "true" ]; then
                  echo "Checking if tag/release $TAG already exists..."
      
                  # Delete GitHub Release if it exists
                  gh release delete "$TAG" --yes 2>/dev/null || true
      
                  # Delete remote Git tag if it exists
                  if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
                    echo "Tag $TAG found on remote. Deleting..."
                    git push --delete origin "$TAG" || true
                  fi
      
                  # Delete local tag if it exists
                  git tag -d "$TAG" 2>/dev/null || true
                fi

            - name: Write credentials
              if: steps.check.outputs.should_release == 'true'
              shell: bash
              env:
                  DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
              run: |
                  mkdir -p apikeys
                  echo '{"api_keys": [], "google": {}}' > apikeys/release.json
                  jq -n --arg id "$DISCORD_CLIENT_ID" '{client_id: $id}' > apikeys/discord.json

            - name: Package release
              if: steps.check.outputs.should_release == 'true'
              run: bun run package --cached --profile release

            - name: Create tag
              if: steps.check.outputs.should_release == 'true'
              run: |
                  git tag "${{ steps.check.outputs.tag }}"
                  git push origin "${{ steps.check.outputs.tag }}"

            - name: Create GitHub Release
              if: steps.check.outputs.should_release == 'true'
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.check.outputs.tag }}
                  name: "KuumoApp ${{ steps.check.outputs.tag }}"
                  generate_release_notes: true
                  draft: true
                  files: |
                      artifacts/*.exe
                      artifacts/*.json
